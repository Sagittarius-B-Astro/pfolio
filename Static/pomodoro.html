<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href='https://fonts.googleapis.com/css?family=Baskervville' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../pomodoro.css">
</head>
<body>
    <div class="pomodoro-wrapper">
        <div class="pomodoro-card d-flex flex-column align-items-center">

            <div class="pomodoro-title">
                <span>Pomodoro with my Ri! </span>
                <i class="fas fa-heart title-heart"></i>
            </div>

            <div class="pomodoro-main">
                <div class="timer-box">
                    <div class="timer-display" id="timerDisplay">25:00</div>
                    <div class="timer-controls">
                        <div class="control-cell">
                            <button id="toggleBtn" class="btn control-btn">
                                <i class="fas fa-play"></i> Play
                            </button>
                        </div>
                        <div class="control-cell">
                            <button id="resetBtn" class="btn control-btn">
                                <i class="fas fa-rotate-left"></i> Reset
                            </button>
                        </div>
                    </div>
                </div>

                <div class="checklist-box pink">
                    <div class="checklist-header">Anusri's Checklist</div>
                    <div class="task-entry">
                        <input type="text" id="taskInputR" class="form-control task-input" placeholder="enter your task">
                    </div>
                    <div class="task-list" id="taskListR"></div>
                </div>

                <div class="checklist-box">
                    <div class="checklist-header">Yejun's Checklist</div>
                    <div class="task-entry">
                        <input type="text" id="taskInputY" class="form-control task-input" placeholder="enter your task">
                    </div>
                    <div class="task-list" id="taskListY"></div>
                </div>
            </div>

            <div class="pomodoro-bottom">
                <div class="pomodoro-summary">
                    <div class="summary-title">This Week</div>
                    <div class="summary-metrics">
                        <div class="metric">
                            <span class="metric-value" id="weekTime">0h 0m</span>
                            <span class="metric-label">Time Focused</span>
                        </div>
                        <div class="metric">
                            <span class="metric-value" id="weekCount">0</span>
                            <span class="metric-label">Tasks Completed</span>
                        </div>
                    </div>
                    <div class="summary-list" id="summaryList"></div>
                </div>

                <div class="jar-panel" id="jarPanel">
                    <div class="jar-counter" id="jarCounter">0 tasks</div>

                    <button class="jar-btn jar-btn-top" id="jarListBtn" aria-label="View by week" title="View by week">
                        <i class="fas fa-list"></i>
                    </button>
                    <button class="jar-btn jar-btn-bottom" id="jarEmptyBtn" aria-label="Empty jar" title="Empty jar">
                        <i class="fas fa-eye"></i>
                    </button>

                    <div class="jar-wrap" id="jarWrap">
                        <div class="jar-lid"></div>
                        <div class="jar-neck"></div>
                        <div class="jar-glass">
                            <div class="jar-slips" id="jarSlips"></div>
                        </div>
                        <div class="jar-spill" id="jarSpill"></div>
                    </div>

                    <div class="jar-scattered" id="jarScattered"></div>
                    <div class="jar-empty-hint" id="jarEmptyHint">complete a task to fill the jar</div>
                    <div class="jar-blur" id="jarBlur"></div>

                    <div class="jar-weeks" id="jarWeeks">
                        <div class="jar-weeks-title">Completed by week</div>
                        <div class="jar-weeks-list" id="jarWeeksList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script>
    <script src="../pomodoro.js"></script>
</body>
</html>
